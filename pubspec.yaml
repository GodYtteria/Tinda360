name: tinda360
description: Offline-first POS app for sari-sari stores and community shops.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  clock: ^1.1.3
  cupertino_icons: ^1.0.8
  cupertino_ui: ^1.1.7
  drift: ^2.35.4
  file_picker: ^13.4.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_svg: ^2.4.0
  go_router: ^18.1.4
  google_sign_in: ^7.2.0
  google_sign_in_platform_interface: ^3.1.0
  googleapis: ^19.0.0
  http: ^1.6.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  material_ui: ^1.11.1
  meta: ^1.19.0
  mobile_scanner: ^7.5.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  sqlite3: ^3.9.1
  sqlite3_flutter_libs: ^0.6.0+eol
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/ai/
    - assets/app_icon/app_icon_full.png
    - assets/avatar/
    - assets/logo/
    - assets/icons/

flutter_icons:
  android: true
  ios: true
  image_path: assets/app_icon/app_icon_full.png
  adaptive_icon_background: "#0F5C4A"
  adaptive_icon_foreground: assets/app_icon/app_icon_full.png
